<!doctype html>
<html>
  <head>
    <!-- This is the vhcaracter set attribute.
     It specifies the character encoding of the HTML doc.
     UTF-8 charset covers almost every font you will use. Failure to
     add this tag will result in custom fonts not loading properly-->
    <meta charset="UTF-8" />
    <!-- the viewport tag sets the initial scale andensures proper responsive behavior
     Failure to include this tag will result in your media queries not working
     or being recognized at all
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The title tag shows up as the big blue link in a search
     results and in the browser tab -->
    <title>HTML Boilerplate with Comments</title>
  </head>
  <!-- Everything inside the body tag shows up inside the browser window -->
  <body>
    <h1>Intro to Web Dev Cokbook</h1>
    <!-- This is an H1, Only 1 h1 per page. This is the most important heading on the page!-->
    <p>
      Welcome to our class cookbook! please enjoy <strong>our recipes</strong> from around the <em>globe!!</em>
    </p>
    <h2>
      Here is our first image tag, break the image file link to see the alt text appear!
    </h2>

    <img src="img/pancake-hero.webp" 
    alt="Fluffy buttermilk pancakes with hot maple syrub and a ton of butter."
    width="400"
    />
    <!-- el img antes del nombre de la foto, es para el code sepa localizar la foto porque la foto esta adentro de la carpeta de img, si solo pusiese el nombre (estando en una carpeta) el code no va a saber en donde esta la foto.-->
     <!-- el width es para modificar el tamaño de las fotos, pero con css no sera necesario, esto es solo hoy-->
  </body>
</html>
