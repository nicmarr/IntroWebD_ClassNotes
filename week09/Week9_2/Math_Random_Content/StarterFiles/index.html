      /* =======================================================
      1. ARRAYS - one variable holding a list of values
      Square brackets, comma separated values within
      ======================================================= */

      const headliners = [
        'Bad Moon Rising',
        'Velvet Static',
        'Dial Tone',
        'Mountain Time',
        'Kerosene Club',
        'The Paper Cuts',
      ]
      // headliners = multiple items in list (plurals) headliner (singular)

      const supports =[
        'Low Ceiling',
        'The Ferry lights',
        'Tiny Mirrors',
        'Garden State Radio',
      ]

      const djs = ['DJ Shortwave', 'DJ Halfmoon', 'DJ FFerry']

      const venues = [
        'The Filmore East',
        'Rough Trade',
        'Brooklyn Steel',
        'Market Hotel',
      ]

      const nights = ['Thurs 12 Nov', 'Fri 13 Nov', 'Sat 14 Nov']

      const taglines = [
        'Strictly 18+. No re-entry',
        'Late set. Bring earplugs',
        'All ages until 10 pm',
        'Sold Out 3 times running',
      ]

       /* =======================================================
      2. PICKING ONE AT RANDOM
          Math.random ()
          gives ys a float from 0 up to (but not including) 1
          multiply by the lenght, floor it, and you get a valid index number
      ======================================================= */

     /* console.log(headliners.lenght) // gives us a cpunt of items in the array
      console.log(headliners[5]) // gives us the last item in the array, but what if we don't know how many items are in the array?
      console.log(headliners[headliners.lenght - 1]) 
      A whole number between min and max, both ends included. The + 1 is what lets max come up at all. */

      function pickRandom(list) {
        const index = Math.floor(Math.random() * list.length)
        return list[index]
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min
      }

      /* =========================================================
        3. A DIFFERENT SHOW EVERY RELOAD
        Same variable names as Tuesday -- only the right-hand side
        of each line has changed.
      ========================================================= */

      const headliner = pickRandom(headliners)
      const support = pickRandom(supports)
      const venue = pickRandom(venues)
      const doors = `${pickRandom(nights)}, doors 8pm`

       // a price between $12 and $45, always ending .50
      const ticketPrice = randomBetween(12, 45) + 0.5

      const capacity = randomBetween(120, 400)
      // deliberately close to capacity, so all three statuses turn up
      const ticketsSold = randomBetween(capacity - 25, capacity)

      const serviceFeeRate = 0.12
      const studentPrice = 5
      const isStudent = true
      let quantity = randomBetween(1, 4)

      /* =========================================================
        4. EVERYTHING FROM TUESDAY, UNCHANGED
        The rules did not move. Only the facts did.
      ========================================================= */

       const ticketsLeft = capacity - ticketsSold
      const isSoldOut = ticketsLeft === 0
      const isAlmostSoldOut = ticketsLeft < 10

      const subtotal = ticketPrice * quantity
      const serviceFee = subtotal * serviceFeeRate
      const discount = isStudent ? studentPrice : 0
      const total = subtotal + serviceFee - discount

      const billing = `${headliner.toUpperCase()} + ${support}`
      const whereWhen = `${venue} · ${doors}`

      let status

      if (isSoldOut) {
        status = 'Sold out — join the waiting list'
      } else if (isAlmostSoldOut) {
        status = `Hurry — only ${ticketsLeft} tickets left`
      } else {
        status = 'Tickets available'
      }

      /* =========================================================
        5. THE MATH OBJECT, WITH SOMETHING TO DO
      ========================================================= */

      // round: nearest whole number, for the poster price
      const posterPrice = Math.round(ticketPrice)

      // floor: always down. How many tickets $100 actually buys.
      const ticketsForAHundred = Math.floor(100 / ticketPrice)

      // ceil: always up. Four shuttle vans is not enough for 50 people,
      // and you cannot book half a van.
      const vansNeeded = Math.ceil(ticketsSold / 14)

      // max: never show a negative number of tickets, whatever happens above
      const safeTicketsLeft = Math.max(0, ticketsLeft)

      const finePrint = `Tickets from $${posterPrice} · ${safeTicketsLeft} of ${capacity} remaining · ${vansNeeded} shuttle vans booked`

      /* =========================================================
        6. A FOR LOOP OVER THE LINEUP
      ========================================================= */

      const lineup = [pickRandom(djs), support, headliner]

      let lineupHTML = ''

      for (let i = 0; i < lineup.length; i++) {
        const setTime = 8 + i // 8pm, 9pm, 10pm

        // i % 2 is the remainder after dividing by 2: 0, 1, 0, 1...
        // so this is true on every other row.
        const stripe = i % 2 === 0 ? 'stripe' : ''

        // the last act on the list is the headliner
        const isHeadliner = i === lineup.length - 1
        const act = isHeadliner
          ? `<span class="headline-act">${lineup[i]}</span>`
          : lineup[i]

        lineupHTML += `<li class="${stripe}"><span class="time">${setTime}pm</span>${act}</li>`
      }

      /* =========================================================
        7. ON THE PAGE
      ========================================================= */

      document.querySelector('#billing').textContent = billing
      document.querySelector('#where-when').textContent = whereWhen
      document.querySelector('#status').textContent = status
      document.querySelector('#price-line').textContent =
        `${quantity} × $${ticketPrice.toFixed(2)}  —  $${subtotal.toFixed(2)}`
      document.querySelector('#fee-line').textContent =
        `Service fee  —  $${serviceFee.toFixed(2)}`
      document.querySelector('#discount-line').textContent = isStudent
        ? `Student discount  —  −$${discount.toFixed(2)}`
        : ''
      document.querySelector('#total').textContent = `$${total.toFixed(2)}`
      document.querySelector('#fine-print').textContent = finePrint
      document.querySelector('#tagline').textContent = pickRandom(taglines)

      // innerHTML, not textContent, because this string contains real tags
      document.querySelector('#lineup').innerHTML = lineupHTML

      /* =========================================================
        8. A RANDOM COLOR SCHEME
        Remember --accent from the CSS variables lesson? JavaScript
        can set one, and every rule using it updates at once.
      ========================================================= */

      document.body.style.setProperty('--accent', pickRandom(accents))
