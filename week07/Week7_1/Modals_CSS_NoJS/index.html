<!doctype html>
<html>
  <head>
    <title>New York City Gallery</title>
    <!-- Link to CSS File here -->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        a.button {
            text-decoration: none;
            color: white;
            background-color: blueviolet;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            display: inline-block;
        }

        /* modal styles */
        .info_modal {
             /* stretch the div to cover the entire screen */
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            /* transparent overlay */
            background-color: rgba(0, 0, 0, 0.3);
            /* make super sure the modal is in front of all other elements on the screen */
            z-index: 9999999999;
            /* invisible by default */
           opacity: 0; 
           /* we always define our transitions on the starting loading state */
           transition: opacity 400ms ease-in;
            /* make sure we cant click anything behind the overlay */
           pointer-events: none;
        }

        /* selector grabs only the targeted id from our anchor tag click event */

        .info_modal:target {
            opacity: 1;
            pointer-events: auto;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .info_modal > div {
            background-color: white;
            width: 600px;
            height: 600px;
            padding: 2rem;
            border-radius: 0.75rem;
            position: relative;
        }

        .close {
            height: 20px;
            width: 20px;
            background-color: antiquewhite;
            /* position in top right corner */
            position: absolute;
            top: 0;
            right: 0;
        }

    </style>
  </head>
  <body>
    <!-- anchor tags that target another element on the page with a specific ID -->
    <!-- anchor tags with a class to make them lok like buttons -->
    <a href="#info_2" class="button">open modal 1</a>
       <!-- another link/button with a different ID targeted to open a different modal -->
    <a href="#info_2" class="button">open modal 2</a>

    <!-- your normal website content goes here -->

    <!-- put the modals at the end of the file, so we don't get confused! -->
    <!--BEGIN MODAL 1  -->
    <!-- parent wrapper div which will have the ID the anchor tag (that looks like a button) targets -->
    <!-- This div is also our transparent overlay that covers the entire page -->
    <div id="info" class="info_modal center">
        <!-- pop up window on/in the overlay -->
         <div>
            <!-- close button targets a ID that doesn't exist on the page to remove our info modal as the selected target-->
            <a href="close" class="close">X</a>
            <h1>Hello Modal!</h1>
            <p> this is our first CSS only modal</p>
         </div>
    </div>
    <!-- END MODAL 1 -->

    <!--BEGIN MODAL 2  -->
    <!-- parent wrapper div which will have the ID the anchor tag (that looks like a button) targets -->
    <!-- This div is also our transparent overlay that covers the entire page -->

    <div id="info_2" class="info_modal center">
        <!-- pop up window on/in the overlay -->
         <div>
            <!-- close button targets a ID that doesnt exist on the
             page to remove our info modal as the selected target -->
            <a href="#close" class="close">X</a>
            <h1>Hello MOdal 2!</h1>
            <p>This is our SECOND CSS only modal!</p>
         </div>
    </div>
    <!-- END MODAL 2 -->
  </body>
